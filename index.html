<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드로그</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* ===== 깔끔·심플·모던 (가로 화면 우선) ===== */
  :root {
    color-scheme: light;
    --bg: #f4f6fa; --surface: #ffffff; --surface-2: #f0f3f8; --text: #171a21; --muted: #5a6373; --border: #e1e6ee;
    --accent: #3562ee; --accent-text: #ffffff; --accent-soft: #e9eeff;
    --ok: #0f7d5a; --ok-soft: #dff4ea; --bad: #c0332d; --bad-soft: #fdeae8;
    --code-bg: #f0f3f8; --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 6px 20px rgba(16, 24, 40, .06);
    --radius: 16px; --rail: 78px;
    --sans: "Noto Sans KR", "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Consolas, "Noto Sans Mono", monospace;
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1217; --surface: #171b22; --surface-2: #1e232c; --text: #edf0f6; --muted: #9ca5b5; --border: #2a303b;
    --accent: #7ba2ff; --accent-text: #0b1020; --accent-soft: #1c2742;
    --ok: #5fd3a2; --ok-soft: #12332a; --bad: #ff8e87; --bad-soft: #3a1c1b;
    --code-bg: #12161c; --shadow: none;
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1217; --surface: #171b22; --surface-2: #1e232c; --text: #edf0f6; --muted: #9ca5b5; --border: #2a303b;
      --accent: #7ba2ff; --accent-text: #0b1020; --accent-soft: #1c2742;
      --ok: #5fd3a2; --ok-soft: #12332a; --bad: #ff8e87; --bad-soft: #3a1c1b;
      --code-bg: #12161c; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); font-size: calc(106.25% * var(--scale, 1)); -webkit-text-size-adjust: 100%; }
  main { overflow-x: clip; }   /* 슬라이드 전환 중 화면이 옆으로 삐져나와 가로 스크롤이 생기지 않게 */
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
    line-height: 1.8; letter-spacing: .012em; word-break: keep-all; overflow-wrap: break-word;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 14px 16px calc(84px * var(--scale, 1) + env(safe-area-inset-bottom, 0px)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .hbtns { display: flex; gap: 8px; }
  h1 { display: flex; align-items: center; gap: 10px; font-size: 1.3rem; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .logo { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; background: var(--accent); color: var(--accent-text); font: 700 .8rem var(--mono); letter-spacing: 0; }
  h2 { font-size: 1.4rem; font-weight: 700; line-height: 1.45; margin: 4px 0 14px; letter-spacing: -.01em; }
  h3 { margin: 0; font-size: 1.1rem; font-weight: 700; line-height: 1.5; }
  p { margin: 10px 0; }
  li { margin: 6px 0; }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button {
    min-height: 46px; padding: 8px 16px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); transition: background .15s, border-color .15s, transform .1s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.small { min-height: 40px; padding: 4px 14px; font-size: .92rem; }
  button.icon { min-height: 44px; width: 44px; padding: 0; display: inline-grid; place-items: center; }
  button.danger { color: var(--bad); }
  .ibtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  svg { flex: none; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  input[type=text], input[type=search], input[type=number] {
    width: 100%; min-height: 46px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface);
  }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .row { display: flex; gap: 10px; margin: 10px 0; }
  .row > * { flex: 1; min-width: 0; }
  .muted { color: var(--muted); font-size: .9rem; }
  .bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin: 10px 0; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
  .hint { display: none; }
  details > summary { cursor: pointer; font-weight: 600; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "▸"; display: inline-block; width: 1.2em; color: var(--muted); }
  details[open] > summary::before { content: "▾"; }
  .info { margin: 6px 0; }
  .info > summary { color: var(--muted); font-weight: 500; font-size: .9rem; }
  .info p { color: var(--muted); font-size: .92rem; margin: 6px 0 6px 1.2em; }

  /* 하단 탭 (좁은 화면) / 왼쪽 세로 탭 (넓은 화면) */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--border); }
  .tabbar div { display: flex; gap: 4px; max-width: 640px; margin: 0 auto; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tabbar button {
    flex: 1; min-width: 0; min-height: 56px; padding: 6px 0; border: 0; background: transparent; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; letter-spacing: 0; white-space: nowrap;
  }
  .tabbar button svg { width: 24px; height: 24px; }
  .tabbar button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
  @media (min-width: 700px) {
    body { padding-left: var(--rail); }
    .tabbar { overflow-y: auto; top: 0; bottom: 0; right: auto; width: var(--rail); border-top: 0; border-right: 1px solid var(--border); }
    .tabbar div { flex-direction: column; max-width: none; margin: 0; padding: 12px 8px; gap: 6px; min-height: 100%; }
    .tabbar button { flex: none; min-height: 66px; }
    #tab-settings { margin-top: auto; }   /* 설정은 세로 탭의 맨 아래 */
    .wrap { padding: 18px 24px 40px; }
  }

  /* 타이머 */
  #view-timer .cols { display: grid; gap: 16px; }
  @media (min-width: 900px) { #view-timer .cols { grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); align-items: start; } }
  #display { font: 700 clamp(2.8rem, 9vw, 4.2rem)/1.15 var(--mono); letter-spacing: 0; text-align: center; }
  #status { text-align: center; }
  .ctls { display: flex; justify-content: center; gap: 16px; margin: 14px 0 16px; }
  .ctl { width: 60px; height: 60px; min-height: 60px; padding: 0; border-radius: 50%; display: inline-grid; place-items: center; }
  .ctl.primary { width: 72px; height: 72px; min-height: 72px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .chip { min-height: 36px; padding: 2px 14px; border-radius: 999px; font-size: .9rem; background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  #msg { min-height: 1.5em; font-size: .92rem; color: var(--bad); }
  #msg.ok { color: var(--ok); }
  .day { border-top: 1px solid var(--border); padding: 12px 0; }
  .day:first-child { border-top: 0; }
  .day-head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
  .rec { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .96rem; padding: 3px 0; }
  .rec span:first-child { flex: 1; }

  /* 학습 */
  .badge { display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 14px; color: #fff; font-weight: 700; font-size: .85rem; flex: none; letter-spacing: 0; }
  .lang-card { display: flex; gap: 14px; align-items: flex-start; }
  .lang-card .body { flex: 1; min-width: 0; }
  .lang-card h3 small { font-weight: 400; color: var(--muted); margin-left: 8px; }
  .resume { border-color: var(--accent); background: var(--accent-soft); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin: 14px 0; }
  .grid > .card { margin: 0; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 0; color: var(--muted); font-size: .9rem; }
  .stats span { display: inline-flex; align-items: center; gap: 5px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 10px 0; }
  .toolbar .search { flex: 1 1 240px; position: relative; }
  .toolbar .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .toolbar .search input { padding-left: 42px; }
  .sub { display: flex; gap: 4px; margin: 14px 0; background: var(--surface-2); padding: 4px; border-radius: 14px; }
  .sub button { flex: 1; min-height: 44px; border: 0; background: transparent; border-radius: 10px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 4px 8px; }
  .sub button[aria-pressed="true"] { background: var(--surface); color: var(--accent); font-weight: 700; box-shadow: 0 1px 3px rgba(16, 24, 40, .14); }
  .sub.wrap { flex-wrap: wrap; }
  @media (max-width: 520px) { .sub { padding: 6px; overflow-x: auto; scrollbar-width: none; } .sub.wrap { flex-wrap: nowrap; } .sub button { flex: 0 0 auto; padding: 4px 12px; white-space: nowrap; } }
  .steps { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 14px; }
  .steps button { width: 42px; min-height: 42px; padding: 0; border-radius: 11px; }
  .steps button[aria-current="step"] { border-color: var(--accent); color: var(--accent); font-weight: 700; box-shadow: inset 0 0 0 1px var(--accent); }
  .steps button.done { background: var(--ok-soft); border-color: transparent; }
  .lesson-grid { display: grid; gap: 22px; margin-bottom: 14px; }
  .lesson-main p, .lesson-main li { font-size: 1.05rem; line-height: 1.95; }
  .lesson-main > :first-child { margin-top: 0; }
  .lesson-grid.single { max-width: 780px; }
  @media (min-width: 1000px) {
    .lesson-grid:not(.single) { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
    .lesson-side { position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow: auto; padding: 4px; }
  }
  .codebox { position: relative; }
  pre { margin: 12px 0; padding: 16px; background: var(--code-bg); border-radius: 12px; overflow-x: auto; font: .9rem/1.65 var(--mono); letter-spacing: 0; word-break: normal; }
  .copy { position: absolute; top: 8px; right: 8px; min-height: 34px; padding: 2px 10px; font-size: .8rem; opacity: .9; }
  pre.out { background: #0b0f1a; color: #7ef0a0; min-height: 2.6em; white-space: pre-wrap; }
  iframe { width: 100%; height: 220px; border: 1px solid var(--border); border-radius: 12px; background: #fff; }
  .choice { display: flex; gap: 12px; width: 100%; text-align: left; margin: 10px 0; padding: 12px 16px; line-height: 1.6; }
  .choice b { color: var(--accent); }
  .choice.right { background: var(--ok-soft); border-color: var(--ok); }
  .choice.wrong { background: var(--bad-soft); border-color: var(--bad); }
  textarea.editor { width: 100%; display: block; margin: 10px 0; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--code-bg); color: var(--text); font: .9rem/1.65 var(--mono); letter-spacing: 0; resize: vertical; tab-size: 2; }
  .sub-h { font-size: 1.05rem; margin: 22px 0 8px; }
  code.ic { background: var(--code-bg); padding: 2px 7px; border-radius: 6px; font: .88em var(--mono); letter-spacing: 0; }
  .callout { background: var(--accent-soft); border-radius: 12px; padding: 14px 18px; margin: 14px 0; }
  .callout.warn { background: var(--bad-soft); }
  .callout ul { margin: 6px 0 0; padding-left: 20px; }
  pre.tbl { white-space: pre; font-size: .82rem; }
  .tablewrap { overflow-x: auto; margin: 12px 0; }
  .tablewrap table { border-collapse: collapse; font-size: .92rem; min-width: 100%; }
  .tablewrap th, .tablewrap td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
  .tablewrap th { background: var(--surface-2); white-space: nowrap; }
  details.track { padding: 16px 20px; }
  .mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 14px; }
  .mod-row { display: flex; flex-direction: column; justify-content: space-between; gap: 12px; border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; background: var(--surface-2); }
  .mod-main { flex: 1; min-width: 0; }
  .mod-main b { line-height: 1.45; display: block; }
  .mod-main .sum { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 4px; }
  .mod-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .chk { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
  .chk input { width: 22px; height: 22px; flex: none; margin-top: 4px; }
  .ref .kind { display: inline-block; font-size: .74rem; padding: 1px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-right: 8px; letter-spacing: 0; }
  .ref a { color: var(--accent); font-weight: 600; word-break: break-word; }
  .refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .refs > .card { margin: 0; }

  /* 노트 */
  textarea.xfer { width: 100%; min-height: 90px; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--code-bg); color: var(--text); font: .85rem/1.6 var(--mono); }
  textarea.note { font: 1rem/1.8 var(--sans); letter-spacing: .012em; min-height: 220px; }
  .nudge { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 12px; padding: 12px 16px; background: var(--accent-soft); border-color: transparent; }
  .nudge > span { flex: 1 1 200px; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
  .settings-grid { display: grid; gap: 16px; }
  @media (min-width: 900px) { .settings-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); align-items: start; } }
  .notes-grid { display: grid; gap: 16px; }
  @media (min-width: 900px) { .notes-grid { grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); align-items: start; } .notes-grid > :last-child { position: sticky; top: 14px; } }
  .note-item { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left; margin: 6px 0; overflow: hidden; }
  .note-item b, .note-item span { max-width: 100%; overflow-wrap: anywhere; }
  .note-item.sel { border-color: var(--accent); background: var(--accent-soft); }
  pre.ai-ans { white-space: pre-wrap; word-break: break-word; font: 1rem/1.85 var(--sans); letter-spacing: .012em; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="logo" aria-hidden="true">&lt;/&gt;</span>코드로그</h1>
    <div class="hbtns">
      <button id="theme" class="icon" aria-label="테마 전환" title="테마 전환"></button>
    </div>
  </header>
  <div id="nudge" class="card nudge" hidden></div>

  <main>
    <section id="view-timer" aria-label="학습 타이머">
      <div class="cols">
        <div>
          <div class="card">
            <div id="display" aria-live="off">00:00:00</div>
            <div id="status" class="muted">대기 중</div>
            <div class="ctls">
              <button id="start" class="ctl primary" aria-label="시작" title="시작 (스페이스바)"></button>
              <button id="pause" class="ctl" aria-label="일시정지" title="일시정지 (스페이스바)"></button>
              <button id="reset" class="ctl" aria-label="초기화" title="초기화"></button>
            </div>
            <input id="subject" type="text" list="subjects" placeholder="과목 (예: Python)" maxlength="30" aria-label="과목">
            <datalist id="subjects"></datalist>
            <div id="chips" class="chips"></div>
            <div class="row"><button id="save" class="primary ibtn" aria-label="기록 저장" title="기록 저장"></button></div>
            <div id="msg" role="status"></div>
          </div>
          <div class="card">
            <div class="day-head"><span id="goal-label"></span><span id="today-total">00:00:00</span></div>
            <div class="bar" aria-hidden="true"><i id="goal-bar" style="width:0%"></i></div>
            <div class="row" style="align-items:center">
              <label for="goal" class="muted" style="flex:2" id="goal-lab"></label>
              <input id="goal" type="number" min="1" max="1440" style="flex:1" title="하루 목표(분)" aria-label="하루 목표(분)">
            </div>
          </div>
        </div>
        <div>
          <div class="card">
            <div class="day-head" id="log-head"></div>
            <div id="log"></div>
          </div>
        </div>
      </div>
    </section>
    <section id="view-learn" aria-label="언어 배우기" hidden></section>
    <section id="view-pro" aria-label="전문가 로드맵" hidden></section>
    <section id="view-notes" aria-label="노트" hidden></section>
    <section id="view-settings" aria-label="설정" hidden></section>
  </main>
</div>

<div class="tabbar"><div>
  <button id="tab-timer" aria-current="page" aria-label="학습 타이머"></button>
  <button id="tab-learn" aria-label="언어 배우기"></button>
  <button id="tab-pro" aria-label="전문가 로드맵"></button>
  <button id="tab-notes" aria-label="노트"></button>
  <button id="tab-settings" aria-label="설정"></button>
</div></div>

<script>
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const fmt = s => `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "role" || k.startsWith("aria-")) e.setAttribute(k, String(v)); else e[k] = v;
  }
  e.append(...kids.filter(k => k != null));
  return e;
}
/* ---------- 아이콘 (선 아이콘 SVG, 글자 대신 쓴다) ---------- */
const ICONS = {
  play: '<polygon points="6 4 20 12 6 20 6 4"/>', pause: '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
  reset: '<path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 10 9 10"/>',
  save: '<path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7V3"/><rect x="8" y="14" width="8" height="7"/>',

let activeWorker = null;
function runJs(code, out) {
  if (activeWorker) { activeWorker.terminate(); activeWorker = null; }

  const src = `(function(){const f=x=>{if(typeof x==="string")return x;if(x===undefined)return"undefined";if(typeof x==="number")return Object.is(x,-0)?"-0":String(x);if(typeof x==="bigint")return x+"n";if(typeof x==="symbol")return x.toString();if(typeof x==="function")return"[Function"+(x.name?": "+x.name:" (anonymous)")+"]";if(x instanceof Error)return x.name+": "+x.message;try{return JSON.stringify(x,(k,v)=>typeof v==="bigint"?v+"n":v)}catch(e){return String(x)}};
const s=(...a)=>postMessage({t:a.map(f).join(" ")});
console.log=s;console.info=s;console.warn=s;console.error=s;
self.onerror=m=>{s("오류: "+m);return true};
self.onunhandledrejection=e=>s("오류: "+((e.reason&&e.reason.message)||e.reason));
try{(0,eval)(${JSON.stringify(code)})}catch(e){s("오류: "+e.message)}

  let w;
  try { w = new Worker(url); } catch (e) { out.textContent = "이 환경에서는 실행할 수 없습니다."; return; }
  activeWorker = w;
  let sync = false;
  w.onmessage = e => {
    if (activeWorker !== w) return;
    if (e.data.sync) { sync = true; return; }
    if (out.textContent.length > 5000) { out.textContent += "…출력이 너무 길어 중단했습니다.\n"; w.terminate(); return; }
    out.textContent += e.data.t + "\n";
  };
  w.onerror = e => { if (activeWorker === w) out.textContent += "오류: " + e.message + "\n"; e.preventDefault(); };
  setTimeout(() => { if (activeWorker === w && !sync) out.textContent += "⏱ 2초 안에 끝나지 않아 중단했습니다 (무한 반복인지 확인해 보세요).\n"; }, 2000);
  setTimeout(() => { w.terminate(); URL.revokeObjectURL(url); if (activeWorker === w) activeWorker = null; }, 3000);
}

  const flushT = () => { if (tbl.length) { nodes.push(tableNode(tbl)); tbl = []; } };

    list = null; para.push(line.trim());

}

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  if (tabName === "timer") {
    if (e.code === "Space" && t.tagName !== "BUTTON") { e.preventDefault(); startedAt ? pause() : start(); }
    return;
  }
  if (tabName === "notes" || tabName === "settings") return;
  if (tabName === "pro") { proKeys(e); return; }
  if (!cur) return;
  const l = allLangs().find(x => x.id === cur.id);
  if (!l) return;
  const lvs = levelsOf(l), V = lvs[cur.lv] || lvs[0];
  const dir = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
  if (cur.mode === "lesson" && dir) {
    const to = cur.step + dir;
    if (to >= 0 && to < V.lessons.length) { cur.step = to; last = { id: l.id, lv: V.idx, step: to }; go(true); }
  } else if (cur.mode === "practice" && dir) {
    const to = cur.pi + dir;
    if (to >= 0 && to < V.practice.length) { cur.pi = to; cur.hint = false; cur.sol = false; go(true); }
  } else if (cur.mode === "quiz" && V.quiz[cur.q] && /^[1-4]$/.test(e.key) && Number(e.key) <= V.quiz[cur.q].choices.length) {
    pick(V, Number(e.key) - 1);
  }
});

function loadData(text) {
  let o; try { o = JSON.parse(text); } catch { return "형식이 올바르지 않습니다. 내보내기로 만든 글을 그대로 붙여 넣으세요."; }
  if (!isObj(o) || o.v !== 1 || !isObj(o.data)) return "이 앱에서 내보낸 글이 아닙니다.";
  const ents = Object.entries(o.data);
  for (const [k, v] of ents) {
    if (!Object.prototype.hasOwnProperty.call(V, k) || typeof v !== "string") return "허용되지 않는 항목이 들어 있습니다.";
    let x; try { x = JSON.parse(v); } catch { return "손상된 항목이 있습니다."; }
    if (!V[k](x)) return `항목 모양이 올바르지 않습니다: ${k}`;
  }
  let old; try { old = ents.map(([k]) => [k, localStorage.getItem(k)]); } catch { return "브라우저 저장소를 쓸 수 없어 가져올 수 없습니다."; }
  try { ents.forEach(([k, v]) => localStorage.setItem(k, v)); }
  catch { old.forEach(([k, v]) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { /* 되돌리기 실패는 무시 */ } }); return "저장하지 못했습니다. 브라우저 저장소 설정을 확인하세요."; }
  return "";
}

/* 진행 기록 파일 저장 + 일주일에 한 번 백업 알림 */

const fmtDate = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

/* 방금 보던 레슨: 메모 꼬리표와 AI에게 줄 배경 자료 (없으면 null) */

      if (ls) return { label: `${m.title} · ${pcur.step + 1}번째 레슨`, text: `${ls.title}\n${ls.body}\n${ls.code || ""}` };

function addNote(ctx, text = "") {

  notes.unshift(n); notes = notes.slice(0, 500); saveNotes(); noteSel = n.id; return n;
}

}

const aiAvail = () => !!(window.claude && typeof window.claude.use === "function");
let aiUI = null, aiCtl = null;                 // 진행 중인 요청이 항상 "지금 보이는" 화면 요소를 갱신하도록 전역으로 둔다
const AI_UNAVAILABLE = "이 화면에서는 AI를 쓸 수 없습니다.";
const AI_ERR = { cancelled: "중지했습니다.", AbortError: "중지했습니다.", not_granted: "AI 사용이 허용되지 않았습니다. 페이지 권한 메뉴에서 허용할 수 있습니다.", rate_limited: "요청이 많습니다. 잠시 뒤에 다시 해 보세요.", refused: "AI가 이 질문에는 답하지 못했습니다. 표현을 바꿔 다시 물어보세요.", session_expired: "접속이 만료됐습니다. 페이지를 새로고침해 주세요.", unavailable: AI_UNAVAILABLE, sampling_disabled: AI_UNAVAILABLE, not_declared: AI_UNAVAILABLE, capability_disabled: AI_UNAVAILABLE };
function aiView() {

  const askBtn = ib("send", "질문하기", { className: "primary", disabled: !!aiBusy }, "질문");
  const stopBtn = ib("stop", "중지", { disabled: !aiBusy }, "중지");
  const saveBtn = ib("edit", "메모에 저장", { className: "small", hidden: !aiOut || !!aiBusy }, "메모에 저장");

    } finally { aiBusy = null; aiCtl = null; aiUI.askBtn.disabled = false; aiUI.stopBtn.disabled = true; aiUI.saveBtn.hidden = !aiOut; }
  };
  stopBtn.onclick = () => { if (aiCtl) aiCtl.abort(); };

  out.push(el("div", { className: "chips" }, ...presets.map(([label, text]) => el("button", { className: "chip", textContent: label, onclick: () => { q.value = text; aiQ = text; q.focus(); } }))),

{

{
